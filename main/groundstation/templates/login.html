<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <title>FireFly — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    body { background: #0c0c0e; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0;
           color: #f5f5f5; font-family: system-ui, sans-serif; }
    .card { background: rgba(18, 18, 20, 0.95); padding: 32px;
            border-radius: 10px; width: 380px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
    h1 { color: #ff7a3a; margin: 0 0 4px; font-size: 22px; letter-spacing: 0.5px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: 1px; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 14px;
            background: #1d1d20; border: 1px solid #2a2a2e; border-radius: 6px;
            color: #f5f5f5; font-size: 14px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #ff7a3a; }
    button { width: 100%; padding: 11px; background: #ff7a3a; color: #111;
             border: 0; border-radius: 6px; font-weight: 600; cursor: pointer;
             font-size: 14px; margin-top: 4px; }
    button:hover { background: #ff8f5a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .toggle { margin-top: 18px; text-align: center; font-size: 13px; color: #aaa; }
    .toggle a { color: #ff7a3a; cursor: pointer; text-decoration: none;
                user-select: none; font-weight: 600; }
    .toggle a:hover { text-decoration: underline; }
    .msg { font-size: 13px; margin-bottom: 12px; min-height: 18px; line-height: 1.4; }
    .msg.error { color: #ff4a1c; }
    .msg.info { color: #4aa3ff; }
    .signup-only { display: none; }
    body.signup-mode .signup-only { display: block; }
    body.signin-mode .signin-only { display: block; }
    .home-logo {
      position: fixed;
      top: 24px;
      left: 32px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px
      font-weight: 700;
      letter-spacing: 5px;
      color: #ff7a3a;
      text-decoration: none;
      z-index: 100;
      transition: opacity 0.2s;
    }
    .home-logo:hover { opacity: 0.75; }
  </style>
</head>
<body class="signin-mode">
  <a href="/" class="home-logo">FIREFLY</a>
  <div class="card">
    <h1>FireFly</h1>
    <div class="sub" id="subtitle">Sign in to your account</div>
    <div id="msg" class="msg"></div>

    <div class="signup-only">
      <label>Name</label>
      <input id="name" type="text" autocomplete="name" />
    </div>

    <label>Email</label>
    <input id="email" type="email" autocomplete="email" />

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <div class="signup-only">
      <label>Confirm Password</label>
      <input id="password2" type="password" autocomplete="new-password" />
    </div>

    <button id="submit">Sign In</button>

    <div class="toggle">
      <span id="mode-label">No account?</span>
      <a id="toggle" role="button" tabindex="0">Create one</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_KEY = "{{ supabase_key }}";
    const $ = (id) => document.getElementById(id);
    let mode = "signin";
    let sb = null;

    function setMode(newMode) {
      mode = newMode;
      document.body.className = mode === "signin" ? "signin-mode" : "signup-mode";
      $("submit").textContent = mode === "signin" ? "Sign In" : "Create Account";
      $("subtitle").textContent = mode === "signin" ? "Sign in to your account" : "Create a new account";
      $("mode-label").textContent = mode === "signin" ? "No account?" : "Have an account?";
      $("toggle").textContent = mode === "signin" ? "Create one" : "Sign in";
      $("password").autocomplete = mode === "signin" ? "current-password" : "new-password";
      clearMsg();
    }

    function showMsg(text, kind = "error") {
      const el = $("msg");
      el.textContent = text;
      el.className = "msg " + kind;
    }
    function clearMsg() { $("msg").textContent = ""; $("msg").className = "msg"; }

    $("toggle").addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

    $("submit").addEventListener("click", doAuth);
    document.querySelectorAll("input").forEach(el => {
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth(); });
    });

    if (!SUPABASE_URL || !SUPABASE_KEY) {
      showMsg("Server missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY env vars.");
      $("submit").disabled = true;
    } else if (typeof window.supabase === "undefined" || !window.supabase.createClient) {
      showMsg("Supabase SDK failed to load (network/CDN issue?). Reload the page.");
      $("submit").disabled = true;
    } else {
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log("[firefly login] Supabase client ready");
      } catch (e) {
        showMsg("Supabase init failed: " + e.message);
        $("submit").disabled = true;
      }
    }

    async function doAuth() {
      if (!sb) return;
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        showMsg("Email and password required.");
        return;
      }

      if (mode === "signup") {
        const name = $("name").value.trim();
        const password2 = $("password2").value;
        if (!name) { showMsg("Name is required."); return; }
        if (password.length < 6) { showMsg("Password must be at least 6 characters."); return; }
        if (password !== password2) { showMsg("Passwords don't match."); return; }
      }

      $("submit").disabled = true;
      clearMsg();

      try {
        const { data, error } = mode === "signin"
          ? await sb.auth.signInWithPassword({ email, password })
          : await sb.auth.signUp({
              email, password,
              options: { data: { full_name: $("name").value.trim() } }
            });
        if (error) throw error;

        const token = data.session?.access_token;
        if (!token) {
          showMsg("Account created. Check your email to confirm, then sign in.", "info");
          setMode("signin");
          $("submit").disabled = false;
          return;
        }

        const r = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j.error || "Server rejected token (HTTP " + r.status + ")");
        }
        location.href = "/";
      } catch (e) {
        showMsg(e.message || String(e));
        $("submit").disabled = false;
        console.error("[firefly login] auth error:", e);
      }
    }
  </script>
</body>
</html>
