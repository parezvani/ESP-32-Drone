<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FireFly — Signing in…</title>
  <style>
    body { background: #0c0c0e; color: #f5f5f5; font-family: system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; flex-direction: column; gap: 16px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #2a2a2e;
               border-top-color: #ff7a3a; border-radius: 50%;
               animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #888; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Completing sign-in…</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient("{{ supabase_url }}", "{{ supabase_key }}");

    sb.auth.onAuthStateChange(async (event, session) => {
      if (session?.access_token) {
        // Hand the token to our Flask session
        const r = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: session.access_token }),
        });
        location.href = r.ok ? "/" : "/login";
      } else if (event === "SIGNED_OUT" || event === "TOKEN_REFRESHED") {
        location.href = "/login";
      }
    });

    // Fallback: if no auth state change fires within 4s, go back to login
    setTimeout(() => { location.href = "/login"; }, 4000);
  </script>
</body>
</html>
